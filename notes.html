.err { min-height: 22px; margin-top: 12px; font-size: 13.5px; color: var(--err); }
.foot { margin-top: 18px; font-size: 11.5px; color: var(--fg-3); line-height: 1.5; }

      return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, key, b64(P.ct));
    }).then(function (buf) {
      var html = new TextDecoder().decode(buf);
      try { sessionStorage.setItem(KEY, pass); } catch (e) { /* storage blocked: the page still opens */ }
      document.open(); document.write(html); document.close();
    });
  }
  function fail() { err.textContent = 'That passphrase did not unlock the page.'; inp.value = ''; busy(false); inp.focus(); }
  if (!(window.crypto && crypto.subtle)) { err.textContent = 'This browser cannot unlock the page. Use a current browser over https.'; btn.disabled = true; return; }
  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var v = inp.value.trim();
    if (!v) { inp.focus(); return; }
    err.textContent = ''; busy(true);
    open(v).catch(fail);
  });
  var saved = null;
  try { saved = sessionStorage.getItem(KEY); } catch (e) { saved = null; }
  if (saved) {
    busy(true);
    open(saved).catch(function () { try { sessionStorage.removeItem(KEY); } catch (e) {} busy(false); inp.focus(); });
  } else {
    inp.focus();
  }
})();
</script>
